<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'"
    />
    <title>Whisker Edge Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        cursor: none;
        user-select: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      #hint {
        position: fixed;
        right: 8px;
        bottom: 8px;
        font: 11px/1.4 system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      #hint.visible {
        opacity: 1;
      }
      #toasts {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .toast {
        position: absolute;
        transform: translate(-50%, -100%);
        white-space: nowrap;
      }
      .toast.below {
        transform: translate(-50%, 0);
      }
      .toast > span {
        display: block;
        font: 600 12px/1.3 system-ui, sans-serif;
        padding: 5px 11px;
        border-radius: 999px;
        background: rgba(24, 20, 17, 0.92);
        border: 1px solid rgba(243, 201, 139, 0.3);
        color: #f0e6da;
        animation: toastIn 1.5s ease forwards;
      }
      .toast.good > span {
        border-color: rgba(243, 201, 139, 0.65);
        color: #f3c98b;
      }
      .toast.bad > span {
        border-color: rgba(214, 138, 138, 0.5);
        color: #e2a3a3;
      }
      @keyframes toastIn {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        12% {
          opacity: 1;
          transform: translateY(0);
        }
        72% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-10px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="toasts"></div>
    <div id="hint">Click to collect</div>
    <script type="module" src="./overlay/main.ts"></script>
  </body>
</html>
