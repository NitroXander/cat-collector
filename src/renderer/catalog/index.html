<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Catdex</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #15120f;
        color: #f0e6da;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px 20px 14px;
        border-bottom: 1px solid #2f2925;
      }
      h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: 0.02em;
      }
      .sub {
        margin-top: 4px;
        font-size: 12.5px;
        color: #8d7f72;
      }
      .sub b {
        color: #f3c98b;
        font-weight: 600;
      }
      .bar {
        margin-top: 10px;
        height: 5px;
        border-radius: 3px;
        background: #2a2521;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        background: #f3c98b;
        transition: width 0.25s ease;
      }
      .stats {
        display: flex;
        gap: 8px;
        padding: 12px 20px;
        border-bottom: 1px solid #2f2925;
      }
      .stat {
        flex: 1;
        background: #1e1a17;
        border: 1px solid #2f2925;
        border-radius: 7px;
        padding: 8px 10px;
      }
      .stat b {
        display: block;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        font-size: 10.5px;
        color: #8d7f72;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 8px 12px 16px;
        overflow-y: auto;
        flex: 1;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 8px;
        border-radius: 8px;
      }
      li + li {
        margin-top: 2px;
      }
      li.locked {
        opacity: 0.45;
      }
      canvas {
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        image-rendering: pixelated;
      }
      .meta {
        flex: 1;
        min-width: 0;
      }
      .name {
        font-size: 13.5px;
        font-weight: 600;
      }
      .flavor {
        font-size: 11.5px;
        color: #8d7f72;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rarity {
        display: inline-block;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 1px 6px;
        border-radius: 999px;
        margin-right: 6px;
        vertical-align: 1px;
      }
      .tally {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: #f3c98b;
        font-weight: 600;
      }
      .empty {
        padding: 26px 20px;
        text-align: center;
        color: #6d6157;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Catdex</h1>
      <div class="sub"><b id="caught">0</b> of <span id="total">0</span> cats collected</div>
      <div class="bar"><span id="bar" style="width: 0%"></span></div>
    </header>
    <div class="stats">
      <div class="stat"><b id="coins">0</b><span>coins</span></div>
      <div class="stat"><b id="captures">0</b><span>captures</span></div>
      <div class="stat"><b id="streak">0</b><span>day streak</span></div>
    </div>
    <ul id="list"></ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
